name: Usage feedback or suggestion
description: Share a reproduction experience, usability issue, or concrete improvement.
title: "[Feedback] "
body:
  - type: dropdown
    id: category
    attributes:
      label: Feedback type
      options:
        - Successful reproduction
        - Documentation or usability
        - Integration need
        - Scenario or feature suggestion
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to accomplish?
      description: Include the source revision and commands if you tried the repository.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened, and what would help?
      description: Describe the concrete result or proposed behavior. Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Evidence or success criteria
      description: Environment/results for a reproduction, or how you would assess a proposed improvement.
