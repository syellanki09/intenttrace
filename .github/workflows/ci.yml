name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Run stale-context scenario
        run: ./gradlew :benchmarks:run --no-daemon

      - name: Verify scenario evidence
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/verify_results.py benchmarks/build/results/stale-context/results.jsonl

      - name: Package reproduction evidence
        run: python3 tools/bundle_results.py benchmarks/build/results/stale-context/results.jsonl --output benchmarks/build/results/stale-context-bundle.zip

      - name: Retain reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: stale-context-${{ github.sha }}
          path: benchmarks/build/results/stale-context-bundle.zip
          if-no-files-found: error
          retention-days: 30
