name: Clean Preview Reproduction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/clean-reproduction.yml
      - docs/clean-reproduction.md
      - docs/preview-walkthrough.md
      - tools/run_preview.py
      - tools/test_run_preview.py
      - tools/run_suite.py
      - tools/verify_suite.py
      - tools/test_suite.py
      - docs/scenario-suite.md
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-reproduction.yml
      - docs/clean-reproduction.md
      - docs/preview-walkthrough.md
      - tools/run_preview.py
      - tools/test_run_preview.py
      - tools/run_suite.py
      - tools/verify_suite.py
      - tools/test_suite.py
      - docs/scenario-suite.md

permissions:
  contents: read

jobs:
  reproduce:
    name: Cold-cache reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Select isolated Gradle user home
        shell: bash
        run: printf 'GRADLE_USER_HOME=%s/intenttrace-clean-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Confirm fresh dependency cache and source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GRADLE_USER_HOME"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/intenttrace-reproduction"
          git rev-parse HEAD | tee "$RUNNER_TEMP/intenttrace-reproduction/source-commit.txt"

      - name: Prepare the complete scenario suite without restored Gradle caches
        shell: bash
        run: python3 tools/run_suite.py

      - name: Retain verified reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: clean-preview-${{ github.sha }}
          path: |
            build/suite/**/suite.zip
            build/suite/**/suite-report.json
            ${{ runner.temp }}/intenttrace-reproduction/source-commit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Retain diagnostics if reproduction fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clean-preview-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/intenttrace-reproduction/
            build/suite/**/build.log
            **/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7
