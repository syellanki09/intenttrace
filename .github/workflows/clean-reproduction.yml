name: Clean Preview Reproduction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/clean-reproduction.yml
      - docs/clean-reproduction.md
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-reproduction.yml
      - docs/clean-reproduction.md

permissions:
  contents: read

jobs:
  reproduce:
    name: Cold-cache reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Select isolated Gradle user home
        shell: bash
        run: printf 'GRADLE_USER_HOME=%s/intenttrace-clean-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Confirm fresh dependency cache and source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GRADLE_USER_HOME"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/intenttrace-reproduction"
          git rev-parse HEAD | tee "$RUNNER_TEMP/intenttrace-reproduction/source-commit.txt"

      - name: Build and run both demonstrations without restored Gradle caches
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean test :benchmarks:run :benchmarks:runContractScenario --no-daemon 2>&1 | tee "$RUNNER_TEMP/intenttrace-reproduction/build.log"

      - name: Independently verify and package stale-context evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/verify_results.py benchmarks/build/results/stale-context/results.jsonl
          python3 tools/bundle_results.py benchmarks/build/results/stale-context/results.jsonl --output benchmarks/build/results/stale-context-bundle.zip
          python3 tools/verify_bundle.py benchmarks/build/results/stale-context-bundle.zip

      - name: Retain verified reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: clean-preview-${{ github.sha }}
          path: |
            benchmarks/build/results/stale-context-bundle.zip
            ${{ runner.temp }}/intenttrace-reproduction/source-commit.txt
            ${{ runner.temp }}/intenttrace-reproduction/build.log
          if-no-files-found: error
          retention-days: 30

      - name: Retain diagnostics if reproduction fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clean-preview-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/intenttrace-reproduction/
            **/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7
